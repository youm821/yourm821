services:
  - type: web
    name: pixel-gallery
    runtime: node
    plan: starter            # always-on. See README for the free option.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        sync: false          # you type this in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
    disk:
      name: gallery-data
      mountPath: /data
      sizeGB: 1
