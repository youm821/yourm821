# Visits the site every 5 minutes from GitHub's side, so it stays awake even if its own check ever stops.
# Set the address in your repo: Settings > Secrets and variables > Actions > Variables > SITE_URL
# (falls back to the address below).
name: keep awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the site
        run: curl -fsS -m 40 --retry 3 --retry-delay 15 "${{ vars.SITE_URL || 'https://yourm821.onrender.com' }}/healthz"
