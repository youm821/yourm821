<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Decorations</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="showav">
<header class="top"><img id="me" class="me" alt="" hidden><div><h1 id="title">Pixel Decorations</h1><p id="subtitle"></p></div><div id="acct" class="acct"></div></header>
<div id="note" class="note" hidden></div>
<nav class="tabs"><button class="tab on" id="tab-gal">Gallery</button><button class="tab" id="tab-show">Showcase</button></nav>
<div id="galwrap">
<section class="tools">
  <input id="q" type="search" placeholder="Search…" autocomplete="off">
  <label class="tog"><input id="av" type="checkbox" checked> Preview on avatar</label>
</section>
<nav id="chips" class="chips"></nav>
<main id="grid"></main>
</div>
<section id="showwrap" class="showwrap" hidden>
  <div class="showhead"><div><h2>Community showcase</h2><p>Pixel art made by visitors. Log in with Yapin&rsquo; to share yours.</p></div><div id="shareBox"></div></div>
  <div id="shareForm" class="panel share" hidden>
    <div class="fields"><input id="sh-title" type="text" placeholder="Name your work" maxlength="60"><input id="sh-file" type="file" accept="image/gif,image/png,image/webp"><button id="sh-go" class="btn" type="button">Submit</button></div>
    <div class="msg" id="sh-msg"></div>
    <small style="color:var(--mute)">GIF, PNG or WebP, up to 5 MB, 16 to 1024 pixels. Only upload your own work.</small>
  </div>
  <div id="showgrid"></div>
</section>
<footer class="foot"><span id="count"></span><a href="/admin">Admin</a></footer>
<div id="modal" class="modal" hidden>
  <div class="sheet">
    <button class="x" id="close" aria-label="Close">&times;</button>
    <div class="stage"><div class="av"></div><img id="mimg" alt=""></div>
    <h2 id="mtitle"></h2><p id="mset"></p>
    <div class="row"><a id="mdl" class="btn" download>Download</a><button id="mcopy" class="btn ghost">Copy link</button></div>
  </div>
</div>
<script src="/gallery.js"></script>
</body>
</html>
