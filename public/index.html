<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="theme-color" content="#14141c">
<title>Pixel Decorations</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body class="showav">
<div id="hero" class="hero"><div id="banner" class="banner" hidden></div>
<header class="top"><img id="me" class="me" alt="" hidden><div><h1 id="title">Pixel Decorations</h1><p id="subtitle"></p></div><a id="support" class="btn ghost sm support" target="_blank" rel="noopener noreferrer" hidden>Support server</a><div id="acct" class="acct"></div></header></div>
<div id="note" class="note" hidden></div>
<nav class="tabs"><button class="tab on" id="tab-gal">Gallery</button><button class="tab" id="tab-show">Showcase</button><a class="tab" href="/partners">Partners</a></nav>
<div id="galwrap">
<p class="hint">Pick a decoration to see it on your avatar.</p>
<section class="tools">
  <input id="q" type="search" placeholder="Search…" autocomplete="off">
  <label class="tog"><input id="av" type="checkbox" checked> Preview on avatar</label>
  <div class="seg" id="gsz" role="group" aria-label="Grid size"><button data-g="s" title="Small">S</button><button data-g="m" title="Medium">M</button><button data-g="l" title="Large">L</button></div>
</section>
<nav id="chips" class="chips"></nav>
<main id="grid"></main>
</div>
<section id="showwrap" class="showwrap" hidden>
  <div class="showhead"><div><h2>Community showcase</h2><p>Pixel art made by visitors. Log in with Yapin&rsquo; to share yours.</p></div><div id="shareBox"></div></div>
  <div id="shareForm" class="panel share" hidden>
    <div class="fields"><input id="sh-title" type="text" placeholder="Name your work" maxlength="60"><input id="sh-file" type="file" accept="image/gif,image/png,image/webp"><button id="sh-go" class="btn" type="button">Submit</button></div>
    <div class="msg" id="sh-msg"></div>
    <small style="color:var(--mute)">GIF, PNG or WebP, up to 5 MB, 16 to 1024 pixels. Only upload your own work.</small>
  </div>
  <div id="showgrid"></div>
</section>
<footer class="foot"><span id="count"></span><span><a href="/about">About</a> <a href="/partners">Partners</a> <a id="support2" target="_blank" rel="noopener noreferrer" hidden>Support server</a> <a href="/admin">Admin</a></span></footer>
<div id="modal" class="modal" hidden>
  <div class="sheet">
    <button class="x" id="close" aria-label="Close">&times;</button>
    <div class="stage"><div class="av"></div><img id="mimg" alt=""></div>
    <h2 id="mtitle"></h2><p id="mset"></p>
  </div>
</div>
<button id="totop" class="totop" hidden aria-label="Back to top">&uarr;</button>
<script src="/badges.js"></script>
<script src="/banner.js"></script>
<script src="/gallery.js"></script>
</body>
</html>
