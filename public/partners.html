<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="theme-color" content="#14141c">
<title>Partners</title>
<meta name="description" content="The organisations and people we work with.">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/partners.css">
</head>
<body>
<header class="top"><img id="me" class="me" alt="" hidden><div><h1 id="title">Pixel Decorations</h1><p id="subtitle"></p></div><a id="support" class="btn ghost sm support" target="_blank" rel="noopener noreferrer" hidden>Support server</a></header>
<nav class="tabs" aria-label="Sections"><button class="tab on" id="tab-gal">Gallery</button><button class="tab" id="tab-show">Showcase</button><a class="tab" href="/partners" style="text-decoration:none;display:inline-block">Partners</a></nav><div id="galwrap">

<div class="showwrap"><div class="showhead"><div><h2>Our partners</h2><p>The organisations and people we work with.</p></div></div></div>

<div class="chips" id="chips" role="group" aria-label="Filter partners by category" hidden></div>

<main>
  <div class="grid pgrid" id="grid"></div>
  <p class="empty" id="state" role="status">Loading partners…</p>
</main>

<footer class="foot">
  <span id="site"></span>
  <span><a href="/">Gallery</a></span>
</footer>

<div class="modal" id="modal" hidden>
  <div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button class="x" id="m-close" type="button" aria-label="Close">&times;</button>
    <div class="pdetail">
      <div class="pstage">
        <img class="big" id="m-big" alt="">
        <div class="pthumbs" id="m-thumbs"></div>
      </div>
      <div class="pinfo">
        <div class="head">
          <img class="plogo" id="m-logo" alt="" hidden>
          <h2 id="m-title"></h2>
        </div>
        <p class="cat" id="m-cat"></p>
        <p class="tag" id="m-tag"></p>
        <p class="desc" id="m-desc"></p>
        <a class="btn" id="m-link" target="_blank" rel="noopener noreferrer" hidden>Visit website</a>
      </div>
    </div>
  </div>
</div>

<script src="/partners.js"></script>
</body>
</html>
